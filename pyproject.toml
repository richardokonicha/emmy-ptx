[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emmy-ptx"
version = "0.1.0"
description = "Compile Emmy Kernel IR directly to NVIDIA PTX — no nvcc, no CUDA C++."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Richard Okonicha" }]
keywords = ["ptx", "gpu", "compiler", "emmy", "kernel-ir", "nvidia", "cuda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "emmy-ml>=0.3.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
emmy-ptx = "emmy_ptx.cli:main"

[project.urls]
Homepage = "https://github.com/richardokonicha/emmy-ptx"
Repository = "https://github.com/richardokonicha/emmy-ptx"

[tool.setuptools.packages.find]
where = ["src"]
